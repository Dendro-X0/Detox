name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Scanner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Scanner tests
        run: pnpm test:scanner

  e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:core

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Core filtering E2E
        run: xvfb-run -a pnpm exec playwright test tests/core-filtering.spec.ts

      - name: Scanner acceptance E2E
        run: xvfb-run -a pnpm exec playwright test tests/scanner-acceptance-e2e.spec.ts

  perf:
    name: Perf regression
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:core

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Perf snapshot
        run: xvfb-run -a pnpm test:perf
